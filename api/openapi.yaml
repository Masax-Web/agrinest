openapi: 3.0.3
info:
  title: AGRI-NEST Core API
  version: "0.1.0"
  description: Core service API contracts (auth, farms, jicho, marketplace)
servers:
  - url: http://localhost:3000
security:
  - SessionCookie: []
  - BearerAuth: []
paths:
  /auth/register:
    post:
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegistrationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'

  /auth/login:
    post:
      summary: Sign in with an email address or phone number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Auth response
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/AuthUser'
                  pin_required:
                    type: boolean
                  challenge_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time

  /auth/pin/verify:
    post:
      summary: Complete a sign-in PIN challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinChallengeRequest'
      responses:
        '200':
          description: PIN accepted and session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'

  /auth/google:
    get:
      summary: Start Google OAuth sign-in
      security: []
      responses:
        '302':
          description: Redirect to Google
        '503':
          description: Google OAuth is not configured

  /auth/google/start:
    post:
      summary: Start Google sign-in or role-specific account registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleOAuthStartRequest'
      responses:
        '200':
          description: Google authorization URL and secure state cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleOAuthStartResult'
        '400':
          description: Invalid persona or phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Invitation required for this persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Google OAuth is not configured or available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/google/callback:
    get:
      summary: Complete Google OAuth and return a one-time exchange code
      security: []
      parameters:
        - name: state
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
        - name: error_description
          in: query
          schema: { type: string }
        - name: error_uri
          in: query
          schema: { type: string }
        - name: iss
          in: query
          schema: { type: string, format: uri }
        - name: scope
          in: query
          allowReserved: true
          schema: { type: string }
        - name: authuser
          in: query
          schema: { type: string }
        - name: prompt
          in: query
          schema: { type: string }
        - name: hd
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Redirect back to the application
        '503':
          description: Application base URL is not configured

  /auth/google/exchange:
    post:
      summary: Exchange a one-time Google code for an application session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleExchangeRequest'
      responses:
        '200':
          description: Session established or PIN challenge issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'

  /auth/profile:
    get:
      summary: Get the authenticated user's farmer profile
      responses:
        '200':
          description: Saved profile, including the account photo fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerProfileResult'
        '401':
          description: A valid session is required
    put:
      summary: Save the authenticated user's farmer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile:
                  $ref: '#/components/schemas/FarmerProfile'
      responses:
        '200':
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerProfileResult'
        '400':
          description: Invalid profile or image
        '401':
          description: A valid session is required
        '413':
          description: Profile exceeds the allowed size

  /auth/admin/impersonate:
    post:
      summary: Start a short-lived super-admin impersonation session
      description: Impersonates one active non-admin account for up to 15 minutes. The admin session remains available to end impersonation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminImpersonationRequest'
      responses:
        '200':
          description: Impersonation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImpersonationResult'
        '403':
          description: Super administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account is not available for impersonation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: A valid administrator session is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/admin/impersonate/end:
    post:
      summary: End the current super-admin impersonation session
      description: Uses the preserved administrator session, even while the impersonated account is active.
      responses:
        '200':
          description: Impersonation ended
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: Administrator session is not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/password:
    put:
      summary: Change the current account password and revoke sessions
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: Password changed; reauthentication is required
          content:
            application/json:
              schema:
                type: object
                required: [success, reauthentication_required]
                properties:
                  success: { type: boolean }
                  reauthentication_required: { type: boolean }

  /auth/pin:
    put:
      summary: Enable or replace the current account PIN
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinChangeRequest'
      responses:
        '200':
          description: PIN enabled
          content:
            application/json:
              schema:
                type: object
                required: [pin_enabled]
                properties:
                  pin_enabled: { type: boolean }
    delete:
      summary: Remove the current account PIN
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentPasswordRequest'
      responses:
        '200':
          description: PIN removed
          content:
            application/json:
              schema:
                type: object
                required: [pin_enabled]
                properties:
                  pin_enabled: { type: boolean }

  /communications/ussd:
    post:
      summary: Handle incoming USSD session events
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UssdSessionRequest'
      responses:
        '200':
          description: USSD session response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UssdSessionResponse'

  /communications/sms/send:
    post:
      summary: Send an SMS message via the communications gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsRequest'
      responses:
        '200':
          description: SMS send result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResult'

  /communications/voice/call:
    post:
      summary: Place a voice call through the communications provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceCallRequest'
      responses:
        '200':
          description: Voice call result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResult'

  /communications/airtime/topup:
    post:
      summary: Top up airtime for a farmer mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AirtimeTopupRequest'
      responses:
        '200':
          description: Airtime topup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResult'

  /communications/google/login:
    post:
      deprecated: true
      summary: Deprecated insecure mock Google login
      security: []
      responses:
        '410':
          description: Use the verified OAuth flow at /auth/google

  /auth/me:
    get:
      summary: Return the authenticated account and persona
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: Missing or expired session

  /auth/logout:
    post:
      summary: Revoke the current session
      security: []
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }

  /auth/admin/users:
    get:
      summary: List accounts for administrators
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, active, suspended] }
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/AuthUser' }
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: A valid session is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/admin/audit:
    get:
      summary: Read the administrator audit log
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        audit_id: { type: string, format: uuid }
                        action: { type: string }
                        details: { type: object }
                        created_at: { type: string, format: date-time }
                        actor_email: { type: string, nullable: true }
                        target_email: { type: string, nullable: true }

  /auth/admin/invitations:
    post:
      summary: Create an invitation for an invitation-only persona
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthInvitationCreate'
      responses:
        '201':
          description: Single-use invitation token
          content:
            application/json:
              schema:
                type: object
                required: [token, persona_id, expires_at]
                properties:
                  token: { type: string }
                  persona_id: { type: string }
                  expires_at: { type: string, format: date-time }
        '403':
          description: Super administrator access required

  /auth/admin/approvals/{userId}:
    post:
      summary: Approve a pending persona application
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Persona approved
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/AuthUser' }
        '403':
          description: Super administrator access required
        '404':
          description: Pending account not found

  /auth/admin/users/{userId}/status:
    patch:
      summary: Suspend or reactivate an account
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserStatusRequest'
      responses:
        '200':
          description: Account status updated
          content:
            application/json:
              schema:
                type: object
                required: [user_id, role_status]
                properties:
                  user_id: { type: string, format: uuid }
                  role_status: { type: string }

  /auth/admin/users/{userId}/persona:
    patch:
      summary: Change an account persona
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserPersonaRequest'
      responses:
        '200':
          description: Account persona updated
          content:
            application/json:
              schema:
                type: object
                required: [user_id, role]
                properties:
                  user_id: { type: string, format: uuid }
                  role: { type: string }

  /auth/admin/integrations:
    get:
      summary: List integration configuration status and enablement
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Integration states; no credentials are returned
          content:
            application/json:
              schema:
                type: object
                required: [integrations]
                properties:
                  integrations:
                    type: array
                    items:
                      type: object
                      required: [id, label, configured, enabled]
                      properties:
                        id: { type: string }
                        label: { type: string }
                        configured: { type: boolean }
                        enabled: { type: boolean }

  /auth/admin/integrations/{integrationId}:
    patch:
      summary: Enable or disable an integration
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema:
            type: string
            enum: [email, sms, voice, airtime, crop_diagnosis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Integration updated
          content:
            application/json:
              schema:
                type: object
                required: [integration]
                properties:
                  integration:
                    type: object
                    required: [id, label, configured, enabled]
                    properties:
                      id: { type: string }
                      label: { type: string }
                      configured: { type: boolean }
                      enabled: { type: boolean }

  /security/scan:
    post:
      summary: Analyze an event with AI cyber threat detection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityScanRequest'
      responses:
        '200':
          description: Threat analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityScanResponse'

  /security/configure:
    post:
      summary: Configure cyber threat detection settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityConfigureRequest'
      responses:
        '200':
          description: Configuration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResult'

  /security/status:
    post:
      summary: Get cyber threat detection status for super admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityStatusRequest'
      responses:
        '200':
          description: Status response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  enabled:
                    type: boolean
                  lastScan:
                    type: object
                  incidentCount:
                    type: integer

  /users:
    get:
      summary: List user profiles (administrator access required)
      responses:
        '200':
          description: Public user directory
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
    post:
      summary: Create a user (administrator access required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /farms:
    post:
      summary: Create a farm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmCreate'
      responses:
        '201':
          description: Farm created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farm'

  /farms/{farmId}:
    get:
      summary: Get farm by ID
      parameters:
        - in: path
          name: farmId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Farm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farm'

  /fields:
    post:
      summary: Add a field to a farm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldCreate'
      responses:
        '201':
          description: Field created

  /jicho/scan:
    post:
      summary: Submit an image for Jicho diagnosis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JichoScanRequest'
      responses:
        '200':
          description: Diagnosis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JichoScanResponse'

  /jicho/scans:
    get:
      summary: List recent Jicho diagnostic scans
      parameters:
        - in: query
          name: farmer_id
          schema: { type: string }
      responses:
        '200':
          description: Recent diagnostic history
          content:
            application/json:
              schema:
                type: object
                properties:
                  scans:
                    type: array
                    items:
                      $ref: '#/components/schemas/JichoHistoryItem'

  /students/dashboard:
    get:
      summary: Get a student dashboard
      parameters:
        - in: query
          name: student_id
          schema: { type: string }
      responses:
        '200':
          description: Student dashboard data
          content:
            application/json:
              schema:
                type: object

  /students/progress:
    post:
      summary: Update student course progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [course_id, progress]
              properties:
                student_id: { type: string }
                course_id: { type: string }
                progress: { type: number }
      responses:
        '200': { description: Progress updated }

  /students/assignments:
    post:
      summary: Submit a student assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                student_id: { type: string }
                name: { type: string }
      responses:
        '201': { description: Assignment submitted }

  /students/applications:
    post:
      summary: Apply for a student opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opportunity_id]
              properties:
                student_id: { type: string }
                opportunity_id: { type: string }
      responses:
        '201': { description: Application submitted }

  /soko/listings:
    post:
      summary: Create a marketplace listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingCreate'
      responses:
        '201':
          description: Listing created
    get:
      summary: List marketplace items (paginated)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Listings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Listing'

  /soko/activity:
    get:
      summary: List recent marketplace activity
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 30, default: 12 }
      responses:
        '200':
          description: Recent marketplace activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MarketplaceActivity' }
    post:
      summary: Publish marketplace activity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceActivityCreate' }
      responses:
        '201': { description: Activity recorded }

  /soko/orders:
    post:
      summary: Place a marketplace order request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceOrderCreate' }
      responses:
        '201': { description: Order request created }

  /soko/events:
    get:
      summary: Subscribe to shared marketplace activity
      parameters:
        - in: query
          name: after
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Server-sent marketplace events
          content:
            text/event-stream:
              schema: { type: string }

  /community/conversations:
    get:
      summary: List community conversations with messages
      responses:
        '200':
          description: Community conversations
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommunityConversation'

  /community/conversations/{conversationId}/messages:
    post:
      summary: Send a community message
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityMessageCreate'
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityMessage'

  /community/admin/messages:
    get:
      summary: List recent community messages for moderation
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Recent messages
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id: { type: string }
                        conversation_id: { type: string }
                        author: { type: string }
                        body: { type: string }
                        created_at: { type: string, format: date-time }

  /community/admin/messages/{messageId}:
    delete:
      summary: Delete a community message
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Message deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        '404':
          description: Message not found

components:
  schemas:
    AuthRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
        staff_access: { type: boolean }
        remember_me: { type: boolean }
    AuthResult:
      type: object
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
        status: { type: string, enum: [active, pending_approval] }
        token: { type: string }
        pin_required: { type: boolean }
        challenge_token: { type: string }
        expires_in: { type: integer }
        expires_at: { type: string, format: date-time }
    AuthUser:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        role: { type: string }
        role_status: { type: string }
        region: { type: string, nullable: true }
        trust_score: { type: number }
        pin_enabled: { type: boolean }
        password_enabled: { type: boolean }
        is_admin: { type: boolean }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
    FarmerProfile:
      type: object
      additionalProperties: true
    FarmerProfileResult:
      type: object
      required: [profile, has_saved_profile]
      properties:
        profile:
          $ref: '#/components/schemas/FarmerProfile'
        has_saved_profile:
          type: boolean
        updated_at:
          type: string
          format: date-time
          nullable: true
    GoogleExchangeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 256 }
    GoogleOAuthStartRequest:
      type: object
      properties:
        registration:
          type: object
          required: [persona_id, phone]
          properties:
            persona_id: { type: string, minLength: 1 }
            phone: { type: string, minLength: 9, maxLength: 20 }
            invitation_token: { type: string, maxLength: 256 }
    GoogleOAuthStartResult:
      type: object
      required: [authorization_url]
      properties:
        authorization_url: { type: string, format: uri }
    AdminImpersonationRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }
    AdminImpersonationResult:
      type: object
      required: [user, impersonation]
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
        impersonation:
          type: object
          required: [admin, expires_at]
          properties:
            admin: { $ref: '#/components/schemas/AuthUser' }
            expires_at: { type: string, format: date-time }
    PinChallengeRequest:
      type: object
      required: [challenge_token, pin]
      properties:
        challenge_token: { type: string, minLength: 1, maxLength: 256 }
        pin: { type: string, pattern: '^[0-9]{6,12}$' }
    CurrentPasswordRequest:
      type: object
      properties:
        current_password: { type: string, minLength: 1, maxLength: 128 }
    PinChangeRequest:
      allOf:
        - $ref: '#/components/schemas/CurrentPasswordRequest'
        - type: object
          required: [pin]
          properties:
            pin: { type: string, pattern: '^[0-9]{6,12}$' }
    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 128 }
        new_password: { type: string, minLength: 12, maxLength: 128 }
    AdminUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, suspended] }
    AdminUserPersonaRequest:
      type: object
      required: [persona_id]
      properties:
        persona_id: { type: string, minLength: 1, maxLength: 80 }
    AuthRegistrationRequest:
      type: object
      required: [name, phone, password, persona_id]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, minLength: 9, maxLength: 16 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        persona_id:
          type: string
          enum: [smallholder_farmer, commercial_farmer, livestock_keeper, farmer_group, agricultural_expert, veterinary_specialist, agri_student, transport_provider, agrishop_owner, warehouse_operator, equipment_owner, local_buyer, exporter, financial_institution, insurance_company, government_agency, ngo_development_organization, impact_investor, ai_model_manager, content_moderator, customer_support_agent, finance_administrator, partnership_manager]
        invitation_token: { type: string }
        region: { type: string }
    AuthInvitationCreate:
      type: object
      required: [persona_id]
      properties:
        persona_id: { type: string, enum: [ai_model_manager, content_moderator, customer_support_agent, finance_administrator, partnership_manager] }
        expires_in_days: { type: integer, minimum: 1, maximum: 30 }

    UserCreate:
      type: object
      required: [phone]
      properties:
        phone: { type: string }
        name: { type: string }

    User:
      type: object
      properties:
        user_id: { type: string }
        name: { type: string }
        role: { type: string }
        region: { type: string }
        trust_score: { type: number }

    FarmCreate:
      type: object
      required: [user_id, name]
      properties:
        user_id: { type: string }
        name: { type: string }
        soil_type: { type: string }
        total_acres: { type: number }

    Farm:
      type: object
      properties:
        farm_id: { type: string }
        user_id: { type: string }
        name: { type: string }

    FieldCreate:
      type: object
      required: [farm_id, name, field_boundary]
      properties:
        farm_id: { type: string }
        name: { type: string }
        crop: { type: string }
        field_boundary: { type: string, description: 'GeoJSON polygon' }

    JichoScanRequest:
      type: object
      required: [farmer_id, image_base64]
      properties:
        farmer_id: { type: string }
        image_base64: { type: string }
        gps:
          type: object
          properties:
            lat: { type: number }
            lon: { type: number }

    JichoScanResponse:
      type: object
      properties:
        scan_id: { type: string }
        diagnosis: { type: string }
        confidence: { type: number }
        recommended_treatment: { type: string }
        severity: { type: string }

    JichoHistoryItem:
      type: object
      properties:
        id: { type: string }
        diagnosis: { type: string }
        confidence: { type: number }
        crop: { type: string }
        farm: { type: string }
        time: { type: string }
        severity: { type: string }
        recommended_treatment: { type: string }

    ListingCreate:
      type: object
      required: [crop_type, quantity]
      properties:
        farmer_id: { type: string, nullable: true }
        crop_type: { type: string }
        quantity: { type: number }
        price: { type: number }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        image_url: { type: string, nullable: true }
        seller_name: { type: string, nullable: true }
        region: { type: string, nullable: true }
        unit: { type: string, nullable: true }

    Listing:
      type: object
      properties:
        listing_id: { type: string }
        farmer_id: { type: string, nullable: true }
        crop_type: { type: string }
        quantity: { type: number }
        price: { type: number }
        name: { type: string, nullable: true }
        category: { type: string, nullable: true }
        description: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        seller_name: { type: string, nullable: true }
        region: { type: string, nullable: true }
        unit: { type: string, nullable: true }

    MarketplaceActivityCreate:
      type: object
      required: [event_type, details]
      properties:
        event_type: { type: string, enum: [cart_item_added] }
        details:
          type: object
          required: [product_name, category]
          properties:
            product_name: { type: string }
            category: { type: string }
            buyer_name: { type: string }
            region: { type: string }

    MarketplaceActivity:
      type: object
      properties:
        activity_id: { type: integer }
        event_type: { type: string }
        details: { type: object }
        created_at: { type: string, format: date-time }

    MarketplaceOrderCreate:
      type: object
      required: [buyer_name, items, total_amount]
      properties:
        buyer_name: { type: string, minLength: 1, maxLength: 120 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, name, quantity, unit_price]
            properties:
              product_id: { type: string }
              name: { type: string }
              quantity: { type: integer, minimum: 1 }
              unit_price: { type: number, minimum: 0 }
        total_amount: { type: number, minimum: 0 }

    CommunityConversation:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        time: { type: string }
        preview: { type: string }
        avatar: { type: string, nullable: true }
        icon: { type: string }
        messages:
          type: array
          items:
            $ref: '#/components/schemas/CommunityMessage'

    CommunityMessage:
      type: object
      properties:
        id: { type: string }
        author: { type: string }
        time: { type: string }
        body: { type: string }
        incoming: { type: boolean }
        avatar: { type: string, nullable: true }
        image: { type: string, nullable: true }
        attachmentName: { type: string, nullable: true }
        attachmentPreview: { type: string, nullable: true }

    CommunityMessageCreate:
      type: object
      properties:
        body: { type: string }
        attachmentName: { type: string }
        attachmentUrl: { type: string }
        attachmentKind: { type: string }
        imageUrl: { type: string }
        location:
          type: object
          properties:
            latitude: { type: number }
            longitude: { type: number }
            label: { type: string }

    UssdSessionRequest:
      type: object
      required: [sessionId, phoneNumber]
      properties:
        sessionId: { type: string }
        phoneNumber: { type: string }
        text: { type: string }

    UssdSessionResponse:
      type: object
      properties:
        message: { type: string }
        endSession: { type: boolean }

    SmsRequest:
      type: object
      required: [phoneNumber, message]
      properties:
        phoneNumber: { type: string }
        message: { type: string }

    VoiceCallRequest:
      type: object
      required: [phoneNumber, voiceMessage]
      properties:
        phoneNumber: { type: string }
        voiceMessage: { type: string }

    AirtimeTopupRequest:
      type: object
      required: [phoneNumber, amount]
      properties:
        phoneNumber: { type: string }
        amount: { type: number }

    GoogleLoginRequest:
      type: object
      required: [email]
      properties:
        idToken: { type: string }
        email: { type: string }
        name: { type: string }
        phone: { type: string }

    GenericResult:
      type: object
      properties:
        success: { type: boolean }
        response: { type: object }
        error: { type: string }
        reason: { type: string }

    SecurityScanRequest:
      type: object
      required: [eventType]
      properties:
        eventType: { type: string }
        details: { type: string }
        source: { type: string }

    SecurityScanResponse:
      type: object
      properties:
        success: { type: boolean }
        analysis:
          type: object
          properties:
            threatDetected: { type: boolean }
            severity: { type: string }
            riskScore: { type: number }
            explanation: { type: string }
            model: { type: string }
        incidentId: { type: string }

    SecurityConfigureRequest:
      type: object
      required: [enabled, superAdminToken]
      properties:
        enabled: { type: boolean }
        superAdminToken: { type: string }

    SecurityStatusRequest:
      type: object
      required: [superAdminToken]
      properties:
        superAdminToken: { type: string }

  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: agrinest_session
    BearerAuth:
      type: http
      scheme: bearer
